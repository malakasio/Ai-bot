services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JARVIS_HOME
        value: /app/jarvis_data
      - key: JARVIS_HOST
        value: 0.0.0.0
      - key: JARVIS_PORT
        value: "8080"
      - key: USER_TIMEZONE
        value: Europe/Athens
      - key: GROQ_API_KEY
        sync: false
      - key: EMBED_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: ""
