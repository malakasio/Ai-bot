version: '3.9'

# JARVIS v7.0 — Docker Compose
#
# Brings up the data and automation plane. The main agent (jarvis_core)
# is usually deployed via systemd on the host — but the `jarvis` service
# here lets you run the full stack in containers for dev/CI.
#
# Default `docker-compose up -d` starts:
#   * postgres    (PostgreSQL 16 + pgvector) — memory layers 2/3/4
#   * n8n         workflow automation that JARVIS triggers via MCP
#
# Optional profiles:
#   --profile app         also run jarvis_core in a container
#   --profile sandbox     command-execution sandbox (Ubuntu)
#   --profile lab         Kali sandbox (no external network)
#   --profile production  Caddy reverse proxy (HTTPS)
#   --profile backup      Litestream replication
#   --profile computer-use Xvfb display server for computer-use tools

services:

  # ─── PostgreSQL + pgvector ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_INITDB_ARGS: "--data-checksums"
  # ─── Qdrant Vector DB (semantic memory) ──────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    networks:
      - jarvis_internal
    restart: unless-stopped
    profiles:
      - full
      - vector

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis_internal
    restart: unless-stopped

  # ─── n8n workflow automation ──────────────────────────────────────────
  # JARVIS triggers webhooks here via the automation MCP server.
  # ─── Qdrant Vector DB (semantic memory) ──────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: jarvis-n8n
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}
      - N8N_PUBLIC_API_DISABLED=false
      - GENERIC_TIMEZONE=${USER_TIMEZONE:-UTC}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-jarvis}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-jarvis}
      - N8N_SECURE_COOKIE=false
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jarvis_internal
    restart: unless-stopped

  # ─── JARVIS core (optional in-container) ──────────────────────────────
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis:v7.0
    container_name: jarvis-core
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/${POSTGRES_DB:-jarvis}
      - N8N_WEBHOOK_BASE=http://n8n:5678/webhook
      - JARVIS_HOME=/var/lib/jarvis
      - PORT=8000
    ports:
      - "${JARVIS_PORT:-8000}:8000"
    volumes:
      - jarvis_data:/var/lib/jarvis
      - /var/log/jarvis:/var/log/jarvis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jarvis_internal
    restart: unless-stopped
    profiles:
      - app

  # ─── Command sandbox (untrusted shell execution) ──────────────────────
  jarvis-sandbox:
    image: ubuntu:22.04
    container_name: jarvis-sandbox
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - ${JARVIS_HOME:-/home/jarvis}/workspace:/workspace:rw
    environment:
      - TERM=dumb
      - NO_COLOR=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks:
      - jarvis_internal
    restart: unless-stopped
    profiles:
      - sandbox

  # ─── Lab sandbox (Kali, no external internet) ─────────────────────────
  jarvis-lab:
    image: kalilinux/kali-rolling:latest
    container_name: jarvis-lab
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - ${JARVIS_HOME:-/home/jarvis}/lab:/workspace:rw
    environment:
      - TERM=dumb
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - jarvis_lab
    restart: unless-stopped
    profiles:
      - lab

  # ─── Xvfb (computer-use / browser automation) ─────────────────────────
  xvfb:
    image: ubuntu:22.04
    container_name: jarvis-xvfb
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb x11vnc
        Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
        sleep 3
        exec x11vnc -display :99 -localhost -nopw -forever
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=:99
    networks:
      - jarvis_internal
    restart: unless-stopped
    profiles:
      - computer-use

  # ─── Caddy reverse proxy (HTTPS, Let's Encrypt) ───────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: jarvis-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - jarvis_internal
    restart: unless-stopped
    profiles:
      - production

  # ─── Litestream DB replication (optional) ─────────────────────────────
  litestream:
    image: litestream/litestream:latest
    container_name: jarvis-litestream
    command: ["replicate"]
    volumes:
      - ${JARVIS_HOME:-/home/jarvis}/data:/data:ro
      - ./config/litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    profiles:
      - backup

volumes:
  qdrant_data:
  postgres_data:
  n8n_data:
  jarvis_data:
  caddy_data:
  caddy_config:

networks:
  jarvis_internal:
    driver: bridge
  jarvis_lab:
    driver: bridge
    internal: true
