# JARVIS v7.0 logrotate config
#
# Install:
#   sudo cp config/logrotate.conf /etc/logrotate.d/jarvis
#   sudo logrotate -d /etc/logrotate.d/jarvis     # debug
#   sudo logrotate -f /etc/logrotate.d/jarvis     # force rotate
#
# Notes:
#   * The agent uses Python's RotatingFileHandler for the JSONL trace; this
#     config is the redundant safety net for environments that prefer
#     system-level rotation. `copytruncate` keeps the file descriptor open
#     instead of renaming, so the Python handler does not need to be told
#     about the rotation.
#   * Audit log lives at AUDIT_LOG_PATH; the systemd unit should set this
#     to /var/log/jarvis/audit.log so the rule below matches.
#   * Sentinel snapshot repo is NOT rotated here — those are git tags,
#     pruned by SNAPSHOT_RETENTION_DAYS via the daemon.

/var/log/jarvis_agent.trace {
    daily
    rotate 14
    size 50M
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    create 0640 jarvis adm
    dateext
    dateformat -%Y%m%d
}

/var/log/jarvis/audit.log {
    daily
    rotate 30
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    create 0640 jarvis adm
    dateext
    dateformat -%Y%m%d
}

/var/log/jarvis/kairos.log {
    weekly
    rotate 8
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    create 0640 jarvis adm
}

/var/log/jarvis/sentinel.log {
    daily
    rotate 30
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    create 0640 jarvis adm
    dateext
    dateformat -%Y%m%d
}

# Legacy location — kept for v6 deployments that haven't migrated yet.
/home/jarvis/jarvis/logs/audit.jsonl {
    daily
    rotate 30
    compress
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d
}
